name: 4.X - Python - Code analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 2'

jobs:
  pick-branches:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          REGEX='^main$|^[0-9]{1,3}\.[0-9]{2}\.[0-9]{1,2}$'

          BRANCHES=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | sed 's|^origin/||' | grep -E "$REGEX" || true)

          MATRIX=$(printf '%s\n' "$BRANCHES" | while read -r ref; do
            sha=$(git rev-parse "origin/$ref")
            jq -n --arg ref "$ref" --arg sha "$sha" '{ref:$ref, sha:$sha}'
          done | jq -s '{include: .}')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  bandit:
    needs: pick-branches
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pick-branches.outputs.matrix) }}

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[sarif]

      - name: Run Bandit (force SARIF)
        run: |
          bandit -r . \
            -x .git,__pycache__,*/test_*,*/test/*,*/tests/*,*/testing/* \
            -f sarif \
            -o bandit.sarif \
            --exit-zero

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit
          ref: refs/heads/${{ matrix.ref }}
          sha: ${{ matrix.sha }}

bandit:
  name: Bandit scan
  needs: pick-branches
  runs-on: ubuntu-24.04

  strategy:
    fail-fast: false
    matrix: ${{ fromJSON(needs.pick-branches.outputs.matrix) }}

  permissions:
    contents: read
    security-events: write

  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.ref }}
        fetch-depth: 0
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit[sarif]

    - name: Run Bandit (generate SARIF)
      run: |
        bandit -r . \
          -x .git,__pycache__,*/test_*,*/test/*,*/tests/*,*/testing/* \
          -f sarif \
          -o bandit.sarif \
          --exit-zero

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: bandit.sarif
        category: bandit
        ref: refs/heads/${{ matrix.ref }}
        sha: ${{ matrix.sha }}
